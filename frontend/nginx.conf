# =============================================================================
#  医数智答 · 智愈医典 —— Nginx 配置
#  作用：
#    1. 托管 Vue3 静态产物，支持 history 路由（刷新不 404）
#    2. 把 /api 反向代理到 FastAPI 后端（规避跨域）
#    3. 开启 gzip 压缩，提升首屏加载速度
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy no-referrer;

    # ---- gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/x-font-ttf font/opentype image/svg+xml;

    # ---- 静态资源长缓存（带 hash 文件名，可安全长期缓存）----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- API 反向代理 ----
    # docker-compose 中后端服务名为 backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式问答必需：关闭缓冲，延长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 后端接口文档（便于答辩现场直接查看）
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ---- SPA history 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
