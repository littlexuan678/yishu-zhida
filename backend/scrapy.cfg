# =============================================================================
#  Scrapy 项目配置
#  作用：让 `scrapy crawl <spider>` 命令可用（无需 runspider 指定脚本路径）
#  用法（在 backend/ 目录下）：
#      scrapy list                                        # 列出可用 spider
#      scrapy crawl pubmed -a query="hypertension" \
#          -O data/processed/pubmed.jsonl                 # 采集 PubMed 文献
#      scrapy crawl med_site -a site=medical_wiki \
#          -O data/processed/med_site.jsonl               # 采集医学站点条目
#
#  若不想使用 scrapy.cfg，可直接用 runspider：
#      scrapy runspider app/data_layer/crawler/spiders/pubmed_spider.py
# =============================================================================

[settings]
default = app.data_layer.crawler.settings

[deploy]
project = zhiyu_medical_codex
