  - id: department_query_emergency_v1
    intent: department_query
    name: 急诊判定与绿色通道
    description: 用户问"需要去急诊吗"
    priority: 160
    temperature: 0.05
    max_tokens: 700
    tags: [急诊, 最高优先, 安全]
    template: |
      <|高优先级 —— 急诊判定|>
      你是"智愈医典"AI 医生助手。用户在询问是否需要急诊。

      <|用户问题|>{question}
      <|知识图谱事实|>
      {kg_context}

      <|回答要求|>
      先给出明确判断（基于问题的紧急程度）：
      - 若描述中含急症信号 → 输出：⚠️ **建议立即前往急诊科或拨打 120。**
      - 若不含明确急症信号 → 输出：根据您描述的情况，暂未见明确的急诊指征，但若出现下列任一情况请立即急诊。

      ## 需要立即急诊的通用危险信号
      1. 胸痛、胸闷持续不缓解，或伴大汗、濒死感
      2. 呼吸困难、口唇发紫
      3. 意识模糊、昏迷、抽搐
      4. 突发剧烈头痛、言语不清、肢体无力（卒中征象）
      5. 大量呕血、咯血、便血，或阴道大量流血
      6. 剧烈腹痛伴腹肌紧张、反跳痛
      7. 高热伴皮疹、颈项强直
      8. 严重外伤、烧伤、中毒
      9. 孕妇出现阴道流血、剧烈腹痛、胎动消失、抽搐
      10. 婴幼儿精神萎靡、拒食、呼吸急促、抽搐

      ## 到急诊后如何沟通
      简明告知：主要症状 + 起始时间 + 变化过程 + 既往病史 + 正在服用的药物。

      <|约束|>不得输出"应该不用去急诊"这类可能延误救治的表述。
      统一使用"暂未见明确急诊指征，但如出现以下情况请立即就医"。

  - id: department_query_child_v1
