      囟门隆起或凹陷、尿量明显减少、持续呕吐、剧烈腹痛。
      ## 三、就诊提示
      携带预防接种记录；如已在外院就诊，携带全部检查资料。

      <|约束|>严禁给出儿科用药建议。

  - id: department_query_specialist_vs_general_v1
