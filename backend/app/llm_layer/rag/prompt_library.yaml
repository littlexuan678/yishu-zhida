      ## 一、血压水平的医学意义
      说明血压分级的一般标准（正常 <120/80，正常高值 120-139/80-89，1 级 140-159/90-99，
      2 级 160-179/100-109，3 级 ≥180/110 mmHg），并指出单次测量不能作为诊断依据
      （此部分为一般性医学常识）。
      ## 二、与高血压相关的生活方式因素
      引用知识库中该病的病因与易感人群信息，标注引用编号。
      ## 三、降压的生活方式干预
      限盐（每日食盐 <5g）、减重、增加钾摄入、限制饮酒、戒烟、规律有氧运动、心理减压。
      ## 四、监测建议
      建议家庭血压监测的方法：安静休息 5 分钟后测量，早晚各一次，连续 7 天取后 6 天平均值；
      记录并就诊时提供给医师。
      ## 五、就医建议
      明确说明：确诊高血压需要非同日 3 次诊室血压测量，须就诊**心血管内科**。
      建议检查项目引用知识库，标注引用编号。
      ## 六、提示
      "血压达到诊断标准时是否需要药物治疗，必须由心血管内科医师评估决定，
      请勿自行服用降压药。"

