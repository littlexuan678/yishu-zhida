# =============================================================================
#  医数智答 · 智愈医典 —— 一键部署编排
#
#  启动：docker compose up -d
#  停止：docker compose down
#  清库重来：docker compose down -v
#
#  启动后：
#    Neo4j Browser : http://127.0.0.1:7474   （neo4j / medical123）
#    后端 API 文档 : http://127.0.0.1:8000/docs
#    后端 OpenAPI  : http://127.0.0.1:8000/openapi.json
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  #  Neo4j 5.8 社区版 —— 知识图谱存储
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.8-community
    container_name: zhiyu-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP / Neo4j Browser
      - "7687:7687"   # Bolt 协议
    environment:
      # ⚠️ 生产环境请改为强口令，并通过 secrets 注入
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-medical123}"
      NEO4J_dbms_default__database: "neo4j"
      # 内存配置（按宿主机规格调整；演示环境 2G 堆足够）
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "512m"
      # 允许从容器外访问
      NEO4J_server_default__listen__address: "0.0.0.0"
      # APOC 插件（图谱批量导入、图算法；GDS 用于 GAT/GCN 补全）
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      # 全文索引（实体检索依赖）
      NEO4J_dbms_index_fulltext_enabled: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      # 初始化 Cypher 脚本（容器首次启动时自动执行）
      # 说明：Neo4j 官方镜像仅在 /docker-entrypoint-initdb.d 下支持 .sh/.cypher
      - ./backend/scripts/cypher/01_constraints.cypher:/docker-entrypoint-initdb.d/01_constraints.cypher:ro
      - ./backend/scripts/cypher/02_indexes.cypher:/docker-entrypoint-initdb.d/02_indexes.cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - zhiyu-net

  # ---------------------------------------------------------------------------
  #  后端 FastAPI + Uvicorn（Python 3.9）
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zhiyu-backend:1.0.0
    container_name: zhiyu-backend
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # ---- 应用 ----
      APP_NAME: "医数智答·智愈医典"
      DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "8000"
      CORS_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      # ---- Neo4j（服务名即主机名）----
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-medical123}"
      NEO4J_DATABASE: "neo4j"
      NEO4J_FALLBACK_TO_MEMORY: "true"
      # ---- 大模型 ----
      # template = 完全离线模板生成（无 GPU 也能完整演示）
      # 接入 Llama 3：LLM_PROVIDER=openai_compatible, LLM_BASE_URL=http://host.docker.internal:11434/v1
      LLM_PROVIDER: "${LLM_PROVIDER:-template}"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:11434/v1}"
      LLM_MODEL: "${LLM_MODEL:-llama3:8b-instruct-q4_K_M}"
      LLM_API_KEY: "${LLM_API_KEY:-ollama}"
      LLM_TEMPERATURE: "0.2"
      LLM_MAX_TOKENS: "1600"
      # Llama 3 医疗 LoRA 适配器（挂载后生效）
      LLM_LORA_PATH: "${LLM_LORA_PATH:-}"
      # ---- RAG ----
      RAG_TOP_K: "12"
      RAG_MAX_HOPS: "2"
      RAG_HALLUCINATION_GUARD: "true"
      RAG_PROMPT_LIBRARY: "/app/app/llm_layer/rag/prompt_library.yaml"
      # ---- 隐私合规 ----
      PRIVACY_MASK_ENABLED: "true"
      PRIVACY_ENCRYPT_ENABLED: "true"
      # ⚠️ 生产环境必须通过 secrets 注入固定密钥
      FIELD_ENCRYPT_KEY: "${FIELD_ENCRYPT_KEY:-}"
      # ---- 模型路径（未挂载权重时自动规则降级）----
      MODEL_DIR: "/app/models"
      NER_MODEL_PATH: "/app/models/ner_bert_bilstm_crf"
      PCNN_MODEL_PATH: "/app/models/pcnn_attention"
      INTENT_MODEL_PATH: "/app/models/intent_textcnn"
      RISK_MODEL_PATH: "/app/models/risk_xgboost.json"
      # ---- 其他 ----
      RATE_LIMIT_PER_MINUTE: "60"
      LOG_LEVEL: "INFO"
      LOG_DIR: "/app/logs"
    volumes:
      # 模型权重（可选）：宿主机 ./backend/models → 容器 /app/models
      - ./backend/models:/app/models:ro
      # 语料与种子数据（可写，便于增量更新）
      - ./backend/data:/app/data
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).status==200 else 1)\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - zhiyu-net

  # ---------------------------------------------------------------------------
  #  前端 Vue3（Nginx 静态托管 + /api 反向代理）—— 可选
  #  仅用开发模式调试时不需要此服务，直接 `cd frontend && pnpm dev` 即可
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: zhiyu-frontend:1.0.0
    container_name: zhiyu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      # 构建期注入（Vite 变量在 build 阶段生效）
      VITE_API_BASE: "/api/v1"
    networks:
      - zhiyu-net

networks:
  zhiyu-net:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  backend_logs:
